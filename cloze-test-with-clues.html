    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        
        /* Cloze Test Styles */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .question-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #166534; /* Green matching the theme */
        }

        .question-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 0;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 10px;
        }

        .clue-box {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.6;
            text-align: center;
            word-spacing: 10px;
        }

        .passage {
            font-size: 16px;
            line-height: 1.8;
            color: #334155;
            text-align: justify;
        }

        .show-ans-btn {
            background-color: #166534;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
            font-family: inherit;
        }

        .show-ans-btn:hover {
            background-color: #14532d;
        }

        .answer-section {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .option-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .opt-btn {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opt-btn:hover, .opt-btn.active {
            background-color: #166534;
            color: white;
        }

        .result-display {
            margin-top: 15px;
            padding: 15px;
            background-color: #fef3c7;
            border-left: 4px solid #f59e0b;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            color: #92400e;
            display: none;
        }

        @media (max-width: 768px) {
            .clue-box {
                word-spacing: 5px;
            }
        }
    </style>
</head>

            let buttonsHTML = letters.map(letter => `

        // Toggle the entire answer section
        function toggleAnswerSection(id) {
            const section = document.getElementById(`ans-sec-${id}`);
            if (section.style.display === 'block') {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
            }
        }

        // Show individual result
        function showResult(questionId, letter, text, btnElement) {
            const resultBox = document.getElementById(`result-${questionId}`);
            
            // Highlight active button
            const allBtns = btnElement.parentElement.querySelectorAll('.opt-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Show result text
            resultBox.style.display = 'block';
            resultBox.innerHTML = `(${letter}) ${text}`;
        }
    </script>

    setInterval(() => {

        if (document.hidden) return; 

        update(timeRef, {
