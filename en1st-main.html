<!DOCTYPE html>
<html lang="bn">
<head>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'hind': ['"Hind Siliguri"', 'sans-serif'],
                        'poppins': ['"Poppins"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- হেডার: পুরো বক্স সবুজ এবং নিচের দিকে কার্ভ করা -->

        <a href="javascript:history.back()" 
           class="absolute top-6 left-4 md:left-8 flex items-center gap-2 text-white/90 hover:text-white bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full transition-all duration-300 backdrop-blur-sm text-sm font-semibold shadow-sm border border-white/10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span class="hidden md:inline font-hind">ফিরে যান</span>

    <div class="flex justify-center -mt-8 px-6 relative z-10">
        <div class="bg-white p-8 shadow-md border-t-4 border-green-800 rounded-2xl max-w-md w-full text-center">
            <p class="text-gray-700 text-lg mb-6 font-hind">
                প্রিমিয়াম সেবা পেতে আমাদের ইউটিউব চ্যানেলটি সাবস্ক্রাইব করুন।
            </p>
            <a href="https://youtube.com/@zamil_academy?si=EbWJq_lwwbWrLar9" 
               target="_blank"
               class="inline-block bg-red-700 hover:bg-green-800 text-white font-semibold py-3 px-8 rounded-full transition duration-300 shadow-md font-hind">
                চ্যানেল ভিজিট করুন

    <!-- মূল কন্টেন্ট -->
    <main class="flex-grow flex flex-col items-center pt-16 pb-12 px-6">
        
        <!-- টাইটেল -->
        <div class="text-center mb-12 relative">
            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-800 font-poppins tracking-wide uppercase">

            <div class="w-20 h-1.5 bg-green-600 rounded-full mx-auto mt-3"></div>
        </div>

        <!-- টপিক বাটন/কার্ড গ্রিড -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
            
            <!-- Option 1: Cloze test with clues -->
            <a href="cloze-test-with-clues.html" class="group relative bg-white rounded-2xl p-8 text-center shadow-sm hover:shadow-xl border border-gray-100 hover:border-green-300 transition-all duration-300 transform hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center min-h-[200px]">

                    </div>
                    <h3 class="text-xl font-bold text-gray-800 font-poppins group-hover:text-green-700 transition-colors">Cloze test with clues</h3>

            <a href="cloze-test-without-clue.html" class="group relative bg-white rounded-2xl p-8 text-center shadow-sm hover:shadow-xl border border-gray-100 hover:border-green-300 transition-all duration-300 transform hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center min-h-[200px]">
                <div class="absolute inset-0 bg-gradient-to-b from-green-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

                    <div class="w-16 h-16 mx-auto bg-green-100 text-green-700 rounded-full flex items-center justify-center mb-4 shadow-inner group-hover:scale-110 transition-transform duration-300">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 font-poppins group-hover:text-green-700 transition-colors">Cloze test without clue</h3>
                </div>
            </a>

            <!-- Option 3: Flow chart -->
            <a href="flow-chart.html" class="group relative bg-white rounded-2xl p-8 text-center shadow-sm hover:shadow-xl border border-gray-100 hover:border-green-300 transition-all duration-300 transform hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center min-h-[200px]">
                <div class="absolute inset-0 bg-gradient-to-b from-green-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative z-10">
                    <div class="w-16 h-16 mx-auto bg-green-100 text-green-700 rounded-full flex items-center justify-center mb-4 shadow-inner group-hover:scale-110 transition-transform duration-300">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>

                    </div>
                    <h3 class="text-xl font-bold text-gray-800 font-poppins group-hover:text-green-700 transition-colors">Flow chart</h3>
