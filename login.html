<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZAMIL ACADEMY - লগইন / রেজিস্ট্রেশন</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #4f46e5, #7c3aed); font-family: 'Segoe UI', system-ui, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); }
    .input-focus:focus { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); border-color: #4f46e5; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 text-white px-2">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-600 font-bold text-xl">ZA</div>
        <div>
          <h1 class="text-2xl font-bold leading-tight">ZAMIL ACADEMY</h1>
        </div>
      </div>
      <button onclick="logout()" id="logout-btn" class="hidden flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-sm font-medium">
        লগআউট
      </button>
    </div>

    <!-- Auth Container -->
    <div id="auth-container" class="glass rounded-3xl shadow-xl overflow-hidden">
      <div class="flex border-b border-gray-100">
        <button onclick="showTab(0)" id="tab-login" class="flex-1 py-4 text-base font-semibold border-b-2 border-indigo-600 text-indigo-700">লগইন</button>
        <button onclick="showTab(1)" id="tab-register" class="flex-1 py-4 text-base font-semibold text-gray-500">রেজিস্ট্রেশন</button>
      </div>

      <div id="login-form" class="p-8">
        <div class="mb-6 text-center">
          <h2 class="text-2xl font-bold text-gray-800">স্বাগতম</h2>
        </div>
        <div class="space-y-4">
          <input id="login-email" type="email" class="input-focus w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" placeholder="ইমেইল">
          <input id="login-password" type="password" class="input-focus w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" placeholder="পাসওয়ার্ড">
          <button onclick="login()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-base mt-2">লগইন করুন</button>
        </div>
      </div>

      <div id="register-form" class="p-8 hidden">
        <div class="mb-6 text-center">
          <h2 class="text-2xl font-bold text-gray-800">নতুন অ্যাকাউন্ট</h2>
        </div>
        <div class="space-y-4">
          <input id="reg-name" type="text" class="input-focus w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" placeholder="আপনার নাম">
          <input id="reg-email" type="email" class="input-focus w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" placeholder="ইমেইল">
          <input id="reg-password" type="password" class="input-focus w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" placeholder="পাসওয়ার্ড">
          <button onclick="register()" class="w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-semibold text-base mt-2">রেজিস্ট্রেশন করুন</button>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden glass rounded-3xl shadow-xl p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">আমার প্রোফাইল</h2>
        <!-- বড় হোম বাটন -->
        <button onclick="goHome()" class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2">
          <i class="fas fa-home"></i> হোম
        </button>
      </div>

      <div class="bg-gray-50 rounded-2xl p-6 mb-6 flex items-center gap-4">
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold" id="avatar"></div>
        <div>
          <h3 class="font-bold text-gray-800 text-lg" id="user-name-display"></h3>
          <p class="text-gray-500 text-sm" id="user-email-full"></p>
        </div>
      </div>

      <button onclick="editProfile()" class="w-full flex items-center justify-between bg-white border border-gray-200 p-4 rounded-xl shadow-sm">
        <span class="font-medium text-sm">নাম পরিবর্তন করুন</span>
        <i class="fas fa-chevron-right text-gray-400"></i>
      </button>
    </div>

    <div id="toast" class="hidden fixed bottom-6 left-4 right-4 text-center bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl text-sm"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABpKz4xjVKWb6kVR_mT8d13dt9lcDwipE",
      authDomain: "zamil-4e08e.firebaseapp.com",
      projectId: "zamil-4e08e",
      storageBucket: "zamil-4e08e.firebasestorage.app",
      messagingSenderId: "696619411784",
      appId: "1:696619411784:web:3dce390ed5b840cbc32b7d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let currentUser = null;

    function showTab(tab) {
      document.getElementById('login-form').classList.toggle('hidden', tab !== 0);
      document.getElementById('register-form').classList.toggle('hidden', tab === 0);
      document.getElementById('tab-login').style.borderBottom = tab === 0 ? "2px solid #4f46e5" : "none";
      document.getElementById('tab-login').style.color = tab === 0 ? "#4338ca" : "#6b7280";
      document.getElementById('tab-register').style.borderBottom = tab === 1 ? "2px solid #7c3aed" : "none";
      document.getElementById('tab-register').style.color = tab === 1 ? "#7c3aed" : "#6b7280";
    }

    function showToast(msg, error = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = error ? '#dc2626' : '#1f2937';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function register() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      if (!name || !email || !pass) return showToast("সব তথ্য দিন", true);
      try {
        const res = await auth.createUserWithEmailAndPassword(email, pass);
        await res.user.updateProfile({ displayName: name });
        loadDashboard(res.user);
      } catch (e) { showToast(e.message, true); }
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      try {
        const res = await auth.signInWithEmailAndPassword(email, pass);
        loadDashboard(res.user);
      } catch (e) { showToast("ভুল ইমেইল বা পাসওয়ার্ড", true); }
    }

    function loadDashboard(user) {
      currentUser = user;
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      document.getElementById('user-name-display').textContent = user.displayName;
      document.getElementById('user-email-full').textContent = user.email;
      document.getElementById('avatar').textContent = (user.displayName || "U").charAt(0).toUpperCase();
    }

    function logout() { auth.signOut().then(() => location.reload()); }
    function goHome() { window.location.href = "index.html"; }
    function editProfile() {
      const newName = prompt("নতুন নাম লিখুন:", currentUser.displayName || "");
      if (newName) {
        currentUser.updateProfile({ displayName: newName }).then(() => {
          showToast("আপডেট হয়েছে!");
          loadDashboard(currentUser);
        });
      }
    }

    auth.onAuthStateChanged(user => { if (user) loadDashboard(user); });
  </script>
</body>
</html>
